<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meal Planner</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2e7d4f"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--bg:#f1f8f3;--card:#fff;--tx:#17301f;--mu:#5d7a66;--ac:#2e7d4f;--bd:#cfe5d5}@media(prefers-color-scheme:dark){:root{--bg:#13201a;--card:#1b2b22;--tx:#e8f5ec;--mu:#9bbba6;--ac:#4cc17d;--bd:#2c4436}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}a{color:var(--ac)}
header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}nav a{margin-left:12px;color:var(--mu);text-decoration:none;font-size:14px}nav a.on{color:var(--ac);font-weight:700}
main{max-width:900px;margin:auto;padding:16px}h1{margin:.2em 0}h2{font-size:18px;margin:.3em 0}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}.hl{border-left:6px solid var(--ac)}
input,select,button,textarea{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}textarea{width:100%}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}.vrat{background:#d9f2e3;color:#1b5e3a}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:58px;border:1px solid var(--bd);border-radius:8px;padding:3px;font-size:12px;overflow:hidden}.cal .h{min-height:0;text-align:center;border:0;color:var(--mu)}.cal .td{outline:2px solid var(--ac)}
.f{display:block;border-radius:4px;padding:1px 4px;margin-top:2px;background:#ffe2b8;color:#5a3300}.u{background:#d9f2e3;color:#1b5e3a}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.done{text-decoration:line-through;color:var(--mu)}

.step{font-size:20px;padding:16px;border-left:5px solid var(--ac);background:var(--bg);border-radius:8px;margin:10px 0}.bar{height:8px;background:var(--bd);border-radius:9px}.bar i{display:block;height:8px;background:var(--ac);border-radius:9px}</style></head>
<body><div id="app"></div><div id="toast"></div><script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const D=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TR={en:{hi:'Namaste',home:'Home',recipes:'Recipes',shop:'Shopping',cal:'Calendar',set:'Settings',out:'Logout',prep:'Prepare today for tomorrow',today:'Today',up:'Upcoming festivals & upvas',plan:'Weekly plan (Auto if blank)',ahead:'Prepare ahead'},
mr:{hi:'नमस्कार',home:'मुख्यपृष्ठ',recipes:'रेसिपी',shop:'खरेदी यादी',cal:'कॅलेंडर',set:'सेटिंग्ज',out:'बाहेर पडा',prep:'उद्यासाठी आजची तयारी',today:'आज',up:'येणारे सण व उपवास',plan:'साप्ताहिक योजना (रिकामे = ऑटो)',ahead:'आधी तयारी'}};

const R=[{id:1,n:"Sabudana Khichdi",v:1,t:"20 min",p:"Soak sabudana 4-6 hours (overnight)",ing:["Sabudana 1 cup","Roasted peanut powder 1/2 cup","Potatoes 2","Green chillies 2","Cumin 1 tsp","Ghee 2 tbsp","Sendha namak","Lemon 1","Coriander"],st:["Drain soaked sabudana; mix with peanut powder and a little salt.","Heat ghee, splutter cumin, add chillies.","Add cubed potatoes, saute 3-4 min.","Add sabudana, cook on low 5-6 min until translucent.","Finish with lemon and coriander."]},
{id:2,n:"Vrat Aloo Sabzi",v:1,t:"25 min",p:"Boil potatoes",ing:["Potatoes 3","Ghee 1 tbsp","Cumin 1 tsp","Green chillies 2","Sendha namak","Black pepper","Coriander"],st:["Peel and cube boiled potatoes.","Heat ghee, add cumin and chillies.","Add potatoes, salt and pepper; toss 5 min.","Garnish with coriander."]},
{id:3,n:"Rajgira Roti",v:1,t:"20 min",p:"Boil potato; keep rajgira flour ready",ing:["Rajgira flour 1 cup","Boiled potato 1","Sendha namak","Ghee"],st:["Mash potato; knead with flour, salt and warm water.","Roll between greased sheets.","Roast on tawa with ghee on both sides."]},
{id:4,n:"Vegetable Poha",v:0,t:"15 min",p:"Buy fresh poha, peanuts, lemon",ing:["Thick poha 1.5 cups","Onion 1","Potato 1","Peanuts 2 tbsp","Mustard 1 tsp","Curry leaves","Turmeric 1/4 tsp","Green chillies 2","Lemon 1","Oil 2 tbsp","Salt"],st:["Rinse poha, drain, add salt and turmeric.","Fry peanuts, mustard, curry leaves, chillies in oil.","Cook onion and potato until soft.","Add poha, mix gently, steam 2 min.","Add lemon and coriander."]},
{id:5,n:"Dal Tadka with Rice",v:0,t:"35 min",p:"Buy tomato/onion; soak dal 30 min before cooking",ing:["Toor dal 1 cup","Rice 1 cup","Tomato 2","Onion 1","Garlic 5 cloves","Cumin 1 tsp","Turmeric 1/2 tsp","Red chilli powder 1/2 tsp","Ghee 2 tbsp","Salt","Coriander"],st:["Pressure cook dal with turmeric and salt (3-4 whistles).","Cook rice separately.","Fry cumin, garlic, onion, tomato in ghee.","Add chilli powder, pour over dal, simmer 5 min.","Serve hot with rice."]},
{id:6,n:"Masala Khichdi",v:0,t:"30 min",p:"Keep moong dal and vegetables ready",ing:["Rice 1/2 cup","Moong dal 1/2 cup","Mixed vegetables 1 cup","Cumin 1 tsp","Turmeric 1/2 tsp","Ghee 1 tbsp","Salt"],st:["Wash rice and dal together.","Saute cumin and vegetables in ghee.","Add rice, dal, turmeric, salt and 4 cups water.","Pressure cook 3 whistles; serve with curd."]},
{id:7,n:"Chapati with Bhaji",v:0,t:"40 min",p:"Buy vegetables; plan to knead dough",ing:["Wheat flour 2 cups","Vegetables 300 g","Onion 1","Tomato 1","Oil 2 tbsp","Mustard 1 tsp","Turmeric 1/2 tsp","Goda masala 1 tsp","Salt"],st:["Knead flour with water, salt, oil; rest 15 min.","Temper mustard; cook onion, tomato, vegetables and spices covered.","Roll and roast chapatis.","Serve together."]},
{id:8,n:"Shingada Puri",v:1,t:"25 min",p:"Boil potato; keep singhara flour ready",ing:["Singhara flour 1 cup","Boiled potato 1","Sendha namak","Oil/ghee for frying"],st:["Knead flour, mashed potato and salt into stiff dough.","Roll small puris.","Deep fry on medium heat until puffed."]}];
const FEST=[{d:'2026-10-29',n:'Karwa Chauth (fast)',t:'u'},{d:'2026-11-08',n:'Diwali (Lakshmi Puja)',t:'f'},{d:'2027-03-06',n:'Maha Shivratri (fast)',t:'u'}];
for(let i=0;i<9;i++)FEST.push({d:D(new Date(2026,9,11+i)),n:'Navratri Day '+(i+1)+' (fast)',t:'u'});FEST.push({d:'2026-10-20',n:'Dussehra',t:'f'});
const user=L('mp_session',null),all=()=>R.concat(L('mp_rec',[])),rec=id=>all().find(r=>r.id==id),plan=()=>L('mp_plan',{}),
cfg=()=>Object.assign({on:1,morning:'07:30',evening:'18:30',prep:1,preptime:'20:00',fast:'',name:'',lang:'en'},L('mp_cfg',{})),
events=()=>FEST.concat(L('mp_events',[])),tmr=()=>{const t=new Date();t.setDate(t.getDate()+1);return t};
let cur=new Date(),Q='',VO=0,CI=0,LM='in';cur.setDate(1);
function eventsOn(d){const c=cfg(),e=events().filter(x=>x.d===D(d));if(c.fast!==''&&d.getDay()==+c.fast&&!e.some(x=>x.t=='u'))e.push({n:DAYS[d.getDay()]+' upvas',t:'u'});return e}
function pick(d,s){const m=(plan()[d.getDay()]||{})[s];if(m)return m;const n=Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/864e5),a=eventsOn(d).some(e=>e.t=='u')?[1,2,3,8]:[4,5,6,7];return a[(n+(s=='evening'?2:0))%4]}
const mealT=s=>{const r=rec(pick(new Date(),s));return r?r.n:'-'},mealL=s=>{const r=rec(pick(new Date(),s));return r?`<a href="#cook/${r.id}">${r.n}</a>`:'-'};
function prepLines(t){const l=[];['morning','evening'].forEach(s=>{const r=rec(pick(t,s));if(r)l.push(r.n+': '+(r.p||'Check ingredients, buy missing items'))});eventsOn(t).forEach(e=>l.push('Tomorrow: '+e.n+(e.t=='u'?' - keep upvas items ready (sabudana, sendha namak, potatoes, peanuts)':'')));return l}
const prepText=()=>'🥬 Prepare today for tomorrow ('+DAYS[tmr().getDay()]+')\n'+prepLines(tmr()).map(x=>'• '+x).join('\n');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',9000)}
function notify(ti,bd){if(!('Notification' in window)||Notification.permission!=='granted')return;const o={body:bd,icon:'icon-192.png',badge:'icon-192.png',tag:ti,renotify:true};if('serviceWorker' in navigator)navigator.serviceWorker.ready.then(r=>r.showNotification(ti,o)).catch(()=>{try{new Notification(ti,o)}catch(e){}});else try{new Notification(ti,o)}catch(e){}}
function remind(slot,force){const c=cfg(),n=new Date(),k=`mp_fired_${D(n)}_${slot}`,tm=slot=='prep'?c.preptime:c[slot],hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
if(!force&&(!c.on||(slot=='prep'&&!c.prep)||localStorage.getItem(k)||(slot=='prep'?hm<tm:hm!==tm)))return;localStorage.setItem(k,1);let ti,bd;
if(slot=='prep'){ti='🥬 Prepare today for tomorrow';bd='• '+prepLines(tmr()).join('\n• ')}else{ti=slot=='morning'?'🌅 Morning meal':'🌙 Evening meal';bd=mealT(slot)}
if(force&&(!('Notification' in window)||Notification.permission!=='granted'))toast('Tap "Allow notifications" in Settings and choose Allow.\n\n'+ti+'\n'+bd);else toast(ti+'\n'+bd);notify(ti,bd)}
const wa=t=>window.open('https://wa.me/?text='+encodeURIComponent(t));
function dl(t,n,y){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;a.click()}
function askNotif(){if(!('Notification' in window))return toast('Not supported in this browser');Notification.requestPermission().then(p=>toast('Notifications: '+p))}
function makeICS(){const c=cfg(),st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',ts=(d,t)=>D(d).replace(/-/g,'')+'T'+t.replace(':','')+'00',esc=t=>t.replace(/[,;\\]/g,'\\$&'),o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MealPlanner//EN'];let u=0;
const ev=(d,t,s,x)=>o.push('BEGIN:VEVENT','UID:mp'+(u++)+'@mealplanner','DTSTAMP:'+st,'DTSTART:'+ts(d,t),'DURATION:PT15M','SUMMARY:'+esc(s),'DESCRIPTION:'+esc(x).replace(/\n/g,'\\n'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(s),'TRIGGER:PT0M','END:VALARM','END:VEVENT');
for(let i=0;i<60;i++){const d=new Date();d.setDate(d.getDate()+i);const t=new Date(d);t.setDate(t.getDate()+1);['morning','evening'].forEach(s=>{const r=rec(pick(d,s));if(r)ev(d,c[s],(s=='morning'?'Morning: ':'Evening: ')+r.n,r.ing.join(', '))});const l=prepLines(t);if(l.length&&c.prep)ev(d,c.preptime,'🥬 Prepare for tomorrow: '+l.join(' • '),'• '+l.join('\n• '))}
o.push('END:VCALENDAR');dl(o.join('\r\n'),'meal-reminders.ics','text/calendar')}
const lgV=()=>`<div class="login card"><h1>🍛 Meal Planner</h1><p style="color:var(--mu)">Plan meals, never forget tomorrow's preparation.</p><input id="nm" placeholder="Your name" style="display:${LM=='up'?'block':'none'}"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button style="width:100%;margin-top:8px" onclick="lg()">${LM=='up'?'Create account':'Login'}</button><p id="msg" style="color:#c0392b"></p><a href="#" onclick="LM=LM=='up'?'in':'up';route();return false">${LM=='up'?'Have an account? Login':'New here? Sign up'}</a></div>`;
function lg(){const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,us=L('mp_users',{});if(!em||pw.length<4)return $('#msg').textContent='Enter email and a password (min 4 chars).';
if(LM=='up'){if(us[em])return $('#msg').textContent='Account exists. Please login.';us[em]={pw:btoa(pw),name:$('#nm').value||em.split('@')[0]};S('mp_users',us)}else if(!us[em]||us[em].pw!==btoa(pw))return $('#msg').textContent='Wrong email or password.';
S('mp_session',{email:em,name:us[em].name});location.hash='home';location.reload()}
const logout=()=>{localStorage.removeItem('mp_session');location.hash='';location.reload()};
function setPlan(i,s,v){const p=plan();p[i]=p[i]||{};p[i][s]=v;S('mp_plan',p);toast('Saved')}
function vHome(){const t=new Date(),ev=eventsOn(t),opts=s=>'<option value="">Auto</option>'+all().map(r=>`<option value="${r.id}" ${s==r.id?'selected':''}>${r.n}</option>`).join(''),p=plan(),up=events().filter(x=>x.d>D(t)).sort((a,b)=>a.d<b.d?-1:1).slice(0,3),l=prepLines(tmr());
return `<h1>${tr('hi')}, ${cfg().name||user.name}!</h1><small>${DAYS[t.getDay()]}, ${t.toLocaleDateString()}</small>
${localStorage.mp_setup?'':`<div class="card"><b>One-time setup</b><p>Allow notifications and add reminders to your phone calendar.</p><div class="row"><button onclick="askNotif()">1. Allow notifications</button><button class="g" onclick="makeICS()">2. Add to phone calendar</button><button class="g" onclick="localStorage.mp_setup=1;route()">Done</button></div></div>`}
<div class="card hl"><h2>🥬 ${tr('prep')}</h2><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul><div class="row"><button onclick="wa(prepText())">📲 Send on WhatsApp</button><button class="g" onclick="remind('prep',1)">🔔 Test</button></div></div>
<div class="card"><h2>${tr('today')}</h2><p>🌅 ${mealL('morning')}</p><p>🌙 ${mealL('evening')}</p>${ev.map(e=>`<span class="tag ${e.t=='u'?'vrat':''}">${e.n}</span>`).join(' ')}</div>
<div class="card"><h2>${tr('up')}</h2><ul>${up.map(e=>`<li>${e.d} - ${e.n}</li>`).join('')||'<li>None</li>'}</ul></div>
<div class="card"><h2>${tr('plan')}</h2><table><tr><th></th><th>Morning</th><th>Evening</th></tr>${DAYS.map((d,i)=>`<tr><td>${d.slice(0,3)}</td>${['morning','evening'].map(s=>`<td><select onchange="setPlan(${i},'${s}',this.value)">${opts((p[i]||{})[s])}</select></td>`).join('')}</tr>`).join('')}</table></div>`}
const listH=()=>all().filter(r=>r.n.toLowerCase().includes(Q.toLowerCase())&&(!VO||r.v)).map(r=>`<div class="card"><b>${r.n}</b> <span class="tag ${r.v?'vrat':''}">${r.v?'Upvas/Vrat':'Regular'}</span> <span class="tag">${r.t}</span><details><summary>Ingredients</summary><ul>${r.ing.map(i=>`<li>${i}</li>`).join('')}</ul></details><div class="row"><a href="#cook/${r.id}"><button>▶ Cook</button></a><button class="g" onclick="addShop(${r.id})">+ Shopping</button></div></div>`).join(''),drawList=()=>$('#list').innerHTML=listH();
const vRec=()=>`<h1>${tr('recipes')}</h1><div class="row"><input value="${Q}" placeholder="Search" oninput="Q=this.value;drawList()"><label><input type="checkbox" ${VO?'checked':''} onchange="VO=this.checked;drawList()"> Upvas only</label></div><div id="list">${listH()}</div>
<details class="card"><summary><b>➕ Add my own recipe</b></summary><input id="rn" placeholder="Recipe name"><label><input type="checkbox" id="rv"> Upvas</label><textarea id="rp" rows="1" placeholder="What to prepare a day before (optional)"></textarea><textarea id="ri" rows="4" placeholder="Ingredients, one per line"></textarea><textarea id="rs" rows="4" placeholder="Steps, one per line"></textarea><button onclick="addRec()">Save recipe</button></details>`;
function addRec(){const n=$('#rn').value.trim(),ln=i=>$(i).value.split('\n').map(x=>x.trim()).filter(Boolean);if(!n||!ln('#ri').length)return toast('Enter name and ingredients');const a=L('mp_rec',[]);a.push({id:Date.now(),n,v:$('#rv').checked?1:0,t:'-',p:$('#rp').value.trim(),ing:ln('#ri'),st:ln('#rs')});S('mp_rec',a);toast('Recipe saved');route()}
function addShop(id){const s=L('mp_shop',[]);rec(id).ing.forEach(i=>{if(!s.some(x=>x.t===i))s.push({t:i,done:0})});S('mp_shop',s);toast('Added to shopping list')}
function vCook(id){const r=rec(id);if(!r)return '<h1>Cooking steps</h1>'+all().map(x=>`<div class="card"><a href="#cook/${x.id}">${x.n}</a> <span class="tag">${x.t}</span></div>`).join('');CI=0;return `<h1>${r.n}</h1><div class="card"><h2>🥬 ${tr('ahead')}</h2><p>${r.p||'Check ingredients'}</p><h2>Ingredients</h2><ul style="list-style:none;padding:0">${r.ing.map(x=>`<li><label><input type="checkbox"> ${x}</label></li>`).join('')}</ul></div><div class="card"><div class="bar"><i id="pg"></i></div><div class="step" id="st"></div><div class="row"><button class="g" onclick="cs(-1,${r.id})">Back</button><button id="nx" onclick="cs(1,${r.id})"></button></div></div>`}
function cs(d,id){const r=rec(id),n=r.st.length;if(d==1&&CI==n-1)toast('Wah! Jevan tayar 🎉');CI=Math.max(0,Math.min(n-1,CI+d));$('#st').innerHTML=`<small>Step ${CI+1} of ${n}</small><br>${r.st[CI]}`;$('#pg').style.width=(CI+1)/n*100+'%';$('#nx').textContent=CI==n-1?'Done ✓':'Next'}
const vShop=()=>{const s=L('mp_shop',[]);return `<h1>${tr('shop')}</h1><div class="card"><div class="row"><input id="ni" placeholder="Add item"><button onclick="addI()">Add</button></div><div class="row"><button class="g" onclick="addWeek()">Add ingredients for next 7 days</button><button class="g" onclick="wa('🛒 Shopping list\\n'+L('mp_shop',[]).filter(x=>!x.done).map(x=>'• '+x.t).join('\\n'))">📲 WhatsApp</button><button class="g" onclick="S('mp_shop',L('mp_shop',[]).filter(x=>!x.done));route()">Remove ticked</button></div><ul style="list-style:none;padding:0">${s.map((x,i)=>`<li><label class="${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="tick(${i})"> ${x.t}</label></li>`).join('')||'<li>List is empty.</li>'}</ul></div>`};
function tick(i){const s=L('mp_shop',[]);s[i].done^=1;S('mp_shop',s);route()}
function addI(){const v=$('#ni').value.trim();if(!v)return;const s=L('mp_shop',[]);s.push({t:v,done:0});S('mp_shop',s);route()}
function addWeek(){const s=L('mp_shop',[]);for(let k=0;k<7;k++){const d=new Date();d.setDate(d.getDate()+k);['morning','evening'].forEach(sl=>rec(pick(d,sl)).ing.forEach(x=>{if(!s.some(y=>y.t===x))s.push({t:x,done:0})}))}S('mp_shop',s);route()}
function vCal(){const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),td=D(new Date());let h=DAYS.map(d=>`<div class="h">${d.slice(0,3)}</div>`).join('')+'<div class="h"></div>'.repeat(cur.getDay());
for(let d=1;d<=n;d++){const dt=new Date(y,m,d);h+=`<div class="${D(dt)==td?'td':''}">${d}${eventsOn(dt).map(e=>`<span class="f ${e.t=='u'?'u':''}">${e.n}</span>`).join('')}</div>`}
return `<h1>${tr('cal')}</h1><div class="row"><button class="g" onclick="cur.setMonth(cur.getMonth()-1);route()">&lt;</button><b>${cur.toLocaleString('default',{month:'long',year:'numeric'})}</b><button class="g" onclick="cur.setMonth(cur.getMonth()+1);route()">&gt;</button></div><div class="cal card">${h}</div><div class="card"><h2>Add your own date</h2><div class="row"><input type="date" id="ed"><input id="en" placeholder="Name (e.g. Ekadashi)"><select id="et"><option value="u">Upvas</option><option value="f">Festival</option></select><button onclick="addEv()">Add</button></div><small>Built-in dates are samples; verify with your panchang.</small></div>`}
function addEv(){const d=$('#ed').value,n=$('#en').value.trim();if(!d||!n)return;const e=L('mp_events',[]);e.push({d,n,t:$('#et').value});S('mp_events',e);route()}
function vSet(){const c=cfg();return `<h1>${tr('set')}</h1><div class="card"><div class="row"><input id="sn" placeholder="Your name" value="${c.name}"><select id="sl"><option value="en" ${c.lang=='en'?'selected':''}>English</option><option value="mr" ${c.lang=='mr'?'selected':''}>मराठी</option></select></div>
<p><label><input type="checkbox" id="so" ${c.on?'checked':''}> Reminders on</label></p><p>🌅 Morning <input type="time" id="sm" value="${c.morning}"> 🌙 Evening <input type="time" id="se" value="${c.evening}"></p>
<p><label><input type="checkbox" id="sp" ${c.prep?'checked':''}> 🥬 Day-before prep reminder</label> at <input type="time" id="st2" value="${c.preptime}"></p>
<p>Weekly upvas day <select id="sf"><option value="">None</option>${DAYS.map((d,i)=>`<option value="${i}" ${c.fast===String(i)?'selected':''}>${d}</option>`).join('')}</select></p>
<div class="row"><button onclick="svSet()">Save</button><button class="g" onclick="askNotif()">Allow notifications</button><button class="g" onclick="remind('morning',1)">Test meal</button><button class="g" onclick="remind('prep',1)">Test prep</button></div>
<div class="row"><button class="g" onclick="makeICS()">📅 Download phone calendar reminders (.ics)</button></div><small>Calendar events appear even when the app is closed. Google Calendar may ignore the alarm in the file and use its default notification time; set it to "At time of event". Download again after changing plans.</small></div>
<div class="card"><h2>Backup</h2><div class="row"><button class="g" onclick="exportD()">Export data</button><label>Restore <input type="file" accept=".json" onchange="importD(this)"></label></div><small>Use backup to move your data to another phone or laptop.</small></div>
<p style="font-size:13px;color:var(--mu)">Notifications: ${'Notification' in window?Notification.permission:'not supported'} | ${location.protocol=='https:'||location.hostname=='localhost'?'web link OK':'NOT a web link: open your https link for notifications'}</p>`}
function svSet(){S('mp_cfg',{on:$('#so').checked?1:0,morning:$('#sm').value,evening:$('#se').value,prep:$('#sp').checked?1:0,preptime:$('#st2').value,fast:$('#sf').value,name:$('#sn').value,lang:$('#sl').value});toast('Settings saved');route()}
function exportD(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('mp_')&&k!='mp_session'&&!k.startsWith('mp_fired'))o[k]=localStorage.getItem(k)}dl(JSON.stringify(o),'meal-planner-backup.json','application/json')}
function importD(i){const f=i.files[0];if(f)f.text().then(t=>{const o=JSON.parse(t);for(const k in o)if(k.startsWith('mp_'))localStorage.setItem(k,o[k]);toast('Restored');route()}).catch(()=>toast('Invalid file'))}
function route(){const[v,a]=(location.hash.slice(1)||'home').split('/'),app=$('#app');if(!user){app.innerHTML=lgV();return}
const V={home:vHome,recipes:vRec,cook:()=>vCook(a),shop:vShop,cal:vCal,set:vSet},N=['home','recipes','shop','cal','set'];
app.innerHTML=`<header><b>🍛 Meal Planner</b><nav>${N.map(n=>`<a href="#${n}" class="${v==n?'on':''}">${tr(n)}</a>`).join('')}<a href="#" onclick="logout();return false">${tr('out')}</a></nav></header><main>${(V[v]||vHome)()}</main>`;if(v=='cook'&&rec(a))cs(0,a);scrollTo(0,0)}
addEventListener('hashchange',route);route();
if(user){setInterval(()=>{remind('morning');remind('evening');remind('prep')},20000);remind('prep')}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
